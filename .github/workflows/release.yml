name: Release

# 流れ:
#   test/x.y.z[-suffix] の push … 学習とビルドを一式行い、成果物を artifact に
#     残してドラフトリリースを作る。
#   release/x.y.z の push … 学習もビルドもしない。同じコミットで成功した
#     test/* の実行を探し(resolve)、その成果物をそのまま使ってドラフトリリースを
#     作り、承認を待って PyPI に公開する。test で確かめたものそのものが出る。
#     先に同じコミットへ test/* タグを付けて成功させておくこと。
on:
  push:
    tags:
      - "release/*"
      - "test/*"
  # ビルド一式の動作確認用。タグを作らずブランチに対して手動実行できる。
  # バージョンチェックと Release 作成(draft)はタグ push の時だけ行う。
  workflow_dispatch:

permissions:
  contents: write
  # release/* で test/* の実行の artifact を取り込むために必要。
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # release/* では学習とビルドを行わない(test/* の成果物を使う)。
  # windows/macos/linux はこのジョブに依存しているので、一緒に飛ばされる。
  train:
    if: ${{ !startsWith(github.ref, 'refs/tags/release/') }}
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      # タグと momors/Cargo.toml のバージョンがずれたまま学習(~30分)に
      # 突入するのを避けるため、最初にバージョンチェックを行う。
      - name: Verify tag matches momors/Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargoVersion=$(grep '^version' momors/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          tagName="${{ github.ref_name }}"

          if [[ "$tagName" == test/* ]]; then
            tagVersion="${tagName#test/}"
            if [[ "$tagVersion" != "$cargoVersion" && "$tagVersion" != "$cargoVersion"-* ]]; then
              echo "::error::Test tag version ($tagVersion) does not match momors/Cargo.toml version ($cargoVersion) (expected exactly '$cargoVersion' or '$cargoVersion-<suffix>')"
              exit 1
            fi
          else
            echo "::error::Tag '$tagName' does not match the expected 'test/' prefix"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0

      - name: Train model
        shell: bash
        working-directory: momo-train
        run: |
          jobs=$(nproc)
          echo "Detected $jobs logical processors; training with JOBS=$jobs"
          task train JOBS=$jobs

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            dataset/basic_data_*.mbm
            dataset/single_character_dic.tsv

  windows:
    needs: [train]
    runs-on: windows-latest
    env:
      # Windows ランナーの既定コンソールコードページでは momo-train の絵文字入り
      # 出力(例: 📊)がエンコードできず落ちるため、Python を UTF-8 モードで動かす。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: dataset

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.15.1"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0

      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # windows-latest ランナーには WiX Toolset v3.14 がプリインストール済み
      # (手元環境も同じバージョン)。Taskfile.yml の dist:msi がこのパスを
      # ハードコードしているため、PATH に追加するだけでよい。
      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Taskfile.yml の vscode/dist:vscode タスクは node_modules が
      # 存在する前提のため、CI では別途インストールしておく必要がある。
      - name: Install vscode-momo dependencies
        working-directory: vscode-momo
        run: pnpm install --frozen-lockfile

      - name: Verify version consistency across components
        run: task version:check

      - name: Build momo binaries
        run: task rust

      - name: Build wasm bindings
        run: task wasm

      - name: Package VSCode extension
        run: task dist:vscode

      - name: Build Windows installer
        run: task dist:msi

      - name: Build Python (pyo3) wheel
        run: task dist:pyo3

      - name: Build Windows C++ SDK
        run: task sdk:zip:cpp

      - name: Build Windows csharp SDK
        run: task sdk:zip:csharp

      - name: Build Wasm SDK
        run: task sdk:zip:wasm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.msi
            dist/*.vsix
            dist/*.whl
            dist/*.zip

  # macOS用のビルド。pyo3と C++ SDK も作る。
  macos:
    needs: [train]
    runs-on: macos-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: dataset

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0

      - name: Verify version consistency across components
        run: task version:check

      - name: Build momo binaries
        run: task rust

      - name: Build Python (pyo3) wheel
        run: task dist:pyo3

      - name: Build macOS C++ SDK
        run: task sdk:zip:cpp

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/*.whl
            dist/*.zip

  # PyPI配布用のmanylinux wheelを作成する。CIランナー(ubuntu-latest)の
  # glibcにそのままリンクするとPyPI配布に不向きなため、PyO3公式の
  # maturin-actionでmanylinuxコンテナ内ビルドする。
  linux:
    needs: [train]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: dataset

      # SDK(task sdk:zip:cpp)をホスト上で cargo ビルドするために必要。
      # wheel の方は maturin-action のコンテナ内で別途ビルドされる。
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0

      - name: Sync trained model into momors-pyo3
        run: task pyo3:sync

      - name: Generate Rust tables
        run: task rust:gen_tables

      # manylinux_2_28（AlmaLinux 8・glibc 2.28 以上）で作る。manylinux2014 は C++ 標準
      # ライブラリが古く、ONNX Runtime が使う locale の facet（std::__cxx11::collate）が
      # .so に自前で埋め込まれ、システムの libstdc++ が登録したものと id が食い違って
      # BERT の初期化（std::regex）で segfault していた。版は auto にせず明示する。
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --manifest-path momors/crates/momors-pyo3/Cargo.toml
          manylinux: 2_28

      - name: Build Linux C++ SDK
        run: task sdk:zip:cpp

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.whl
            dist/*.zip

  # release/* のときだけ動く。同じコミットで成功した test/* の実行を探し、
  # その run id を後続(release, publish-pypi)へ渡す。見つからなければここで止まる
  # (学習もビルドもしていないので、数十秒で失敗がわかる)。
  resolve:
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches momors/Cargo.toml version
        shell: bash
        run: |
          cargoVersion=$(grep '^version' momors/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          tagVersion="${GITHUB_REF_NAME#release/}"
          if [[ "$tagVersion" != "$cargoVersion" ]]; then
            echo "::error::Tag version ($tagVersion) does not match momors/Cargo.toml version ($cargoVersion)"
            exit 1
          fi

      - name: Find successful test run for this commit
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同じコミットで成功した test/* の push 実行のうち、いちばん新しいもの。
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch | startswith("test/"))] | sort_by(.created_at) | last // empty | "\(.id) \(.head_branch)"')
          if [[ -z "$run" ]]; then
            echo "::error::No successful test/* run found for commit ${GITHUB_SHA}. Push a test/* tag to this commit and let it succeed first."
            exit 1
          fi
          read -r runId testTag <<< "$run"

          # artifact の保存期間(90日)切れも、ここで先に確かめておく。
          available=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${runId}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")')
          for name in windows-dist macos-dist linux-dist; do
            if [[ " $available " != *" $name "* ]]; then
              echo "::error::Artifact '$name' is missing or expired in test run $runId ($testTag)"
              exit 1
            fi
          done

          echo "run_id=$runId" >> "$GITHUB_OUTPUT"
          echo "Using artifacts from ${testTag}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${runId}" | tee -a "$GITHUB_STEP_SUMMARY"

  # test/* と手動実行では、この実行でビルドした成果物を使う。
  # release/* では、resolve が見つけた test/* の実行の成果物を使う。
  # どちらの場合も依存先の一部が skipped になるので、結果を明示して判定する。
  release:
    needs: [windows, macos, linux, resolve]
    if: >-
      ${{ !cancelled() &&
          (needs.resolve.result == 'success' ||
           (needs.windows.result == 'success' &&
            needs.macos.result == 'success' &&
            needs.linux.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      # github-token が空なら、この実行の artifact を取る(download-artifact の仕様)。
      - name: download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist
          run-id: ${{ needs.resolve.outputs.run_id || github.run_id }}
          github-token: ${{ needs.resolve.outputs.run_id && github.token || '' }}

      - name: download macos artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: dist
          run-id: ${{ needs.resolve.outputs.run_id || github.run_id }}
          github-token: ${{ needs.resolve.outputs.run_id && github.token || '' }}

      - name: download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: dist
          run-id: ${{ needs.resolve.outputs.run_id || github.run_id }}
          github-token: ${{ needs.resolve.outputs.run_id && github.token || '' }}

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            dist/*.msi
            dist/*.vsix
            dist/*.whl
            dist/*.zip

  # PyPI公開はrelease/*タグの時だけ行う(test/*での動作確認時に誤って
  # 本番PyPIへ公開してしまうのを避けるため)。PyPI側で事前にこの
  # リポジトリ/workflow/environmentをTrusted Publisherとして登録しておく必要がある。
  # pypi environment には承認者(Required reviewers)を設定してあり、このジョブは
  # 承認待ちで止まる。release に依存させているのは、ドラフトリリースが出来てから
  # 承認待ちに入り、中身を確かめてから承認できるようにするため。
  # 祖先の train/windows/macos/linux が skipped なので、既定の success() では
  # 飛ばされてしまう。結果を明示して判定する。
  publish-pypi:
    needs: [resolve, release]
    if: >-
      ${{ !cancelled() &&
          startsWith(github.ref, 'refs/tags/release/') &&
          needs.resolve.result == 'success' &&
          needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/momors-py
    permissions:
      id-token: write
      actions: read
    steps:
      - name: download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: artifacts/windows
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: download macos artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: artifacts/macos
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: artifacts/linux
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Collect wheels
        run: |
          mkdir -p dist
          cp artifacts/windows/*.whl artifacts/macos/*.whl artifacts/linux/*.whl dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
