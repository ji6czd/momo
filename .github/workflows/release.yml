name: Release

on:
  push:
    tags:
      - "release/*"
  # ビルド一式の動作確認用。タグを作らずブランチに対して手動実行できる。
  # バージョンチェックと Release 作成(draft)はタグ push の時だけ行う。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      # Windows ランナーの既定コンソールコードページでは momo-py の絵文字入り
      # 出力(例: 📊)がエンコードできず落ちるため、Python を UTF-8 モードで動かす。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      # タグと momors/Cargo.toml のバージョンがずれたまま学習(~30分)に
      # 突入するのを避けるため、最初に安く落とす。
      - name: Verify tag matches momors/Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^release/', ''
          $cargoVersion = (Select-String -Path momors/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          if ($tagVersion -ne $cargoVersion) {
            Write-Error "Tag version ($tagVersion) does not match momors/Cargo.toml version ($cargoVersion)"
            exit 1
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.13.0"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0

      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # windows-latest ランナーには WiX Toolset v3.14 がプリインストール済み
      # (手元環境も同じバージョン)。Taskfile.yml の dist:msi がこのパスを
      # ハードコードしているため、PATH に追加するだけでよい。
      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Taskfile.yml の vscode/dist:vscode タスクは node_modules が
      # 存在する前提のため、CI では別途インストールしておく必要がある。
      - name: Install vscode-momo dependencies
        working-directory: vscode-momo
        run: pnpm install --frozen-lockfile

      # ランナーの論理コア数を検出し、momo-py/Taskfile.yml の JOBS を
      # CLI 上書きして学習の並列度をランナーのスペックに合わせる。
      - name: Train model
        shell: pwsh
        working-directory: momo-py
        run: |
          $jobs = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
          Write-Host "Detected $jobs logical processors; training with JOBS=$jobs"
          task train JOBS=$jobs

      - name: Verify version consistency across components
        run: task version:check

      - name: Build momo binaries
        run: task rust

      - name: Build wasm bindings
        run: task wasm

      - name: Package VSCode extension
        run: task dist:vscode

      - name: Build Windows installer
        run: task dist:msi

      - name: Build Python (pyo3) wheel
        run: task dist:pyo3

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            dist/*.msi
            dist/*.vsix
            dist/*.whl
