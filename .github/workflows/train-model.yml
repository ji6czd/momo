name: Train Model

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      model_name:
        description: 'モデル名（オプション）'
        required: false
        default: 'model'

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Train model
        run: |
          python -m momobrl train --tsv=dataset/training_raw.tsv
      
      - name: Upload model artifact
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: ./dataset/training_data.zip
          retention-days: 7