version: "3"

vars:
  # momors-esp32 の cargo target ディレクトリ（Taskfile 内の esp:* タスク参照）
  ESP_TARGET_DIR:
    sh: |
      if [ -n "$ESP_TARGET_DIR" ]; then echo "$ESP_TARGET_DIR"
      elif [ "{{OS}}" = "windows" ]; then echo "{{substr 0 2 .ROOT_DIR}}/mo-esp"
      else echo "{{.ROOT_DIR}}/momors/crates/momors-esp32/target"; fi

tasks:
  default:
    desc: Build all components (rust + python + wasm in parallel, then vscode)
    deps: [rust, python, wasm]
    cmds:
      - task: vscode

  rust:
    desc: Build Rust workspace (release)
    run: once
    dir: momors
    cmds:
      - uv run -p 3.13 tools/gen_char_type_rs.py
      - uv run -p 3.13 tools/gen_normalize_table.py
      - cargo build --release

  rust:gen_tables:
    desc: Generate char_type.rs and normalize_table.rs
    dir: momors
    cmds:
      - uv run -p 3.13 tools/gen_char_type_rs.py
      - uv run -p 3.13 tools/gen_normalize_table.py

  python:
    desc: Build Python package
    dir: momo-py
    cmds:
      - task

  python:test:
    desc: Run Python tests
    dir: momo-py
    cmds:
      - task test

  python:clean:
    desc: Clean Python build artifacts
    dir: momo-py
    cmds:
      - task clean

  wasm:
    desc: Build WebAssembly bindings and copy model for VS Code extension
    vars:
      WASM_OUT: "{{.ROOT_DIR}}/vscode-momo/wasm"
      MODEL_SRC: "{{.ROOT_DIR}}/dataset/basic_data_7.mbm"
      MODEL_DST: "{{.ROOT_DIR}}/vscode-momo/resources/model.mbm"
    sources:
      - momors/crates/momors-wasm/src/**/*.rs
      - momors/crates/momors-core/src/**/*.rs
      - momors/crates/momors-braille/src/**/*.rs
    generates:
      - vscode-momo/wasm/momors_wasm_bg.wasm
      - vscode-momo/resources/model.mbm
    cmds:
      - mkdir -p "{{.WASM_OUT}}"
      - mkdir -p "{{.ROOT_DIR}}/vscode-momo/resources"
      - wasm-pack build momors/crates/momors-wasm --target nodejs --out-dir "{{.WASM_OUT}}"
      - cp "{{.MODEL_SRC}}" "{{.MODEL_DST}}"

  # ---- ESP32-P4 (momors-esp32) ----
  # 前提ツールと手順は BUILD.md の「ESP32-P4 ファームウェア」を参照。
  # 変数（環境変数で上書き可）:
  #   ESP_TARGET_DIR  cargo の target ディレクトリ。Windows は esp-idf-sys のパス長制限（88 文字）
  #                   のためドライブ直下の短いパス（既定 <ドライブ>:/mo-esp）。他 OS はクレート内 target/。
  #   PORT            シリアルポート（省略時は espflash が自動検出）
  esp:build:
    desc: Build ESP32-P4 firmware (momors-esp32, ESP-IDF + nightly; see BUILD.md)
    dir: momors/crates/momors-esp32
    env:
      CARGO_TARGET_DIR: "{{.ESP_TARGET_DIR}}"
    cmds:
      - cargo build --release

  esp:flash:
    desc: Flash ESP32-P4 firmware
    dir: momors/crates/momors-esp32
    vars:
      ELF: "{{.ESP_TARGET_DIR}}/riscv32imafc-esp-espidf/release/momors-esp32"
    cmds:
      - espflash flash {{if .PORT}}-p {{.PORT}}{{end}} --flash-size 16mb --partition-table partitions.csv "{{.ELF}}"

  esp:flash-model:
    desc: Write the window=4 model (.mbm) into the "model" partition (offset 0x400000)
    vars:
      MODEL: "{{.ROOT_DIR}}/dataset/basic_data_4.mbm"
    cmds:
      - espflash write-bin {{if .PORT}}-p {{.PORT}}{{end}} 0x400000 "{{.MODEL}}"

  esp:image:
    desc: Save a merged flash image (bootloader + partition table + app) for distribution
    dir: momors/crates/momors-esp32
    vars:
      ELF: "{{.ESP_TARGET_DIR}}/riscv32imafc-esp-espidf/release/momors-esp32"
      OUT: '{{.OUT | default (printf "%s/dist/momors-esp32-esp32p4.bin" .ROOT_DIR)}}'
    cmds:
      - mkdir -p "{{.OUT | dir}}"
      # --skip-padding が無いとフラッシュ全体（16MB）にパディングされ、0x0 に書くとモデル領域まで潰す
      - espflash save-image --chip esp32p4 --merge --skip-padding --flash-size 16mb --partition-table partitions.csv "{{.ELF}}" "{{.OUT}}"
      - 'echo "wrote {{.OUT}}  （書き込み: espflash write-bin 0x0 {{.OUT}} / モデル: task esp:flash-model）"'

  esp:monitor:
    desc: Open the serial monitor for the ESP32-P4 board
    cmds:
      - espflash monitor {{if .PORT}}-p {{.PORT}}{{end}}

  vscode:
    desc: Compile VSCode extension (requires wasm task to have run first)
    dir: vscode-momo
    cmds:
      - pnpm vsce package -o out/

  test:
    desc: Run all tests
    deps: [check:rust, test:rust, python:test]

  check:rust:
    # momors-pyo3 / momors-wasm は maturin / wasm-pack でビルドするため default-members
    # から外してある。その結果 cargo build も cargo test も触らないので、上位 API を変えた
    # ときの追従漏れが検出できない。リンクを伴わない cargo check なら Python ライブラリも
    # wasm ターゲットも要らないので、ここで全クレートまとめて型検査する。
    desc: Type-check every Rust crate (including momors-pyo3 / momors-wasm)
    dir: momors
    cmds:
      - cargo check --workspace --all-targets

  test:rust:
    desc: Run Rust tests
    dir: momors
    vars:
      DATASET_DIR: "{{.ROOT_DIR}}/dataset"
    env:
      MOMO_DATASET_DIR: "{{.DATASET_DIR}}"
    cmds:
      - cargo test

  eval:regression:
    desc: "回帰テスト: dataset/eval_regression.tsv を全窓(small/medium/large)で検証"
    cmds:
      - bash eval/run_regression.sh

  sdk:
    desc: Build C++, C#, and WebAssembly SDKs and create distribution archives
    deps: [sdk:zip:cpp, sdk:zip:csharp, sdk:zip:wasm]

  sdk:ffi:
    desc: Build FFI DLL only (momors-ffi crate, release)
    dir: momors
    cmds:
      - cargo build --release -p momors-ffi

  sdk:cpp:
    desc: Stage C++ SDK to dist/sdk/cpp/
    vars:
      OUT: "{{.ROOT_DIR}}/dist/sdk/cpp"
      RELEASE: "{{.ROOT_DIR}}/momors/target/release"
      HDR: "{{.ROOT_DIR}}/momors/crates/momors-ffi/include"
      DATA: "{{.ROOT_DIR}}/dataset"
    deps: [sdk:ffi]
    cmds:
      - rm -rf "{{.OUT}}"
      - mkdir -p "{{.OUT}}/include" "{{.OUT}}/lib" "{{.OUT}}/bin" "{{.OUT}}/data" "{{.OUT}}/examples"
      - cp "{{.HDR}}/momo.h"                                "{{.OUT}}/include/"
      - cp "{{.HDR}}/momo_raii.hpp"                         "{{.OUT}}/include/"
      - cp "{{.RELEASE}}/momors_ffi.dll"                    "{{.OUT}}/bin/"
      - cp "{{.RELEASE}}/momors_ffi.dll.lib"                "{{.OUT}}/lib/"
      - cp "{{.DATA}}/basic_data_4.mbm"                     "{{.OUT}}/data/"
      - cp "{{.DATA}}/basic_data_5.mbm"                     "{{.OUT}}/data/"
      - cp "{{.DATA}}/basic_data_7.mbm"                     "{{.OUT}}/data/"
      - cp "{{.DATA}}/single_character_dic.tsv"             "{{.OUT}}/data/"
      - cp "{{.ROOT_DIR}}/examples/cxx/main.cpp"            "{{.OUT}}/examples/"
      - cp "{{.ROOT_DIR}}/examples/cxx/CMakeLists.txt"      "{{.OUT}}/examples/"

  sdk:zip:cpp:
    desc: Create C++ SDK ZIP archive to dist/
    vars:
      VERSION:
        sh: grep '^version' momors/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/'
      STAGE: "{{.ROOT_DIR}}/dist/sdk/cpp"
      OUT: "{{.ROOT_DIR}}/dist/momo-sdk-cpp-{{.VERSION}}.zip"
    deps: [sdk:cpp]
    cmds:
      - rm -f "{{.OUT}}"
      - powershell -NoProfile -Command "Compress-Archive -Path '{{.STAGE}}/*' -DestinationPath '{{.OUT}}'"

  sdk:csharp:
    desc: Build C# NuGet package and stage to dist/sdk/csharp/
    vars:
      VERSION:
        sh: grep '^version' momors/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/'
      OUT: "{{.ROOT_DIR}}/dist/sdk/csharp"
      RELEASE: "{{.ROOT_DIR}}/momors/target/release"
      DATA: "{{.ROOT_DIR}}/dataset"
    deps: [sdk:ffi]
    cmds:
      - rm -rf "{{.OUT}}"
      - mkdir -p "{{.OUT}}/bin" "{{.OUT}}/data"
      - dotnet pack "{{.ROOT_DIR}}/momo-ffi-cs" -c Release -p:Version={{.VERSION}} --nologo -o "{{.OUT}}"
      - cp "{{.RELEASE}}/momors_ffi.dll"                    "{{.OUT}}/bin/"
      - cp "{{.DATA}}/basic_data_4.mbm"                     "{{.OUT}}/data/"
      - cp "{{.DATA}}/basic_data_5.mbm"                     "{{.OUT}}/data/"
      - cp "{{.DATA}}/basic_data_7.mbm"                     "{{.OUT}}/data/"
      - cp "{{.DATA}}/single_character_dic.tsv"             "{{.OUT}}/data/"

  sdk:zip:csharp:
    desc: Create C# SDK ZIP archive to dist/
    vars:
      VERSION:
        sh: grep '^version' momors/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/'
      STAGE: "{{.ROOT_DIR}}/dist/sdk/csharp"
      OUT: "{{.ROOT_DIR}}/dist/momo-sdk-csharp-{{.VERSION}}.zip"
    deps: [sdk:csharp]
    cmds:
      - rm -f "{{.OUT}}"
      - powershell -NoProfile -Command "Compress-Archive -Path '{{.STAGE}}/*' -DestinationPath '{{.OUT}}'"

  sdk:wasm:
    desc: Build WebAssembly SDK (browser target) and stage to dist/sdk/wasm/
    vars:
      OUT: "{{.ROOT_DIR}}/dist/sdk/wasm"
      DATA: "{{.ROOT_DIR}}/dataset"
    sources:
      - momors/crates/momors-wasm/src/**/*.rs
      - momors/crates/momors-core/src/**/*.rs
      - momors/crates/momors-braille/src/**/*.rs
    generates:
      - "{{.OUT}}/pkg/momors_wasm_bg.wasm"
    cmds:
      - rm -rf "{{.OUT}}"
      - mkdir -p "{{.OUT}}/data"
      - wasm-pack build momors/crates/momors-wasm --target web --out-dir "{{.OUT}}/pkg"
      - cp "{{.DATA}}/basic_data_4.mbm" "{{.OUT}}/data/"
      - cp "{{.DATA}}/basic_data_5.mbm" "{{.OUT}}/data/"
      - cp "{{.DATA}}/basic_data_7.mbm" "{{.OUT}}/data/"

  sdk:zip:wasm:
    desc: Create WebAssembly SDK ZIP archive to dist/
    vars:
      VERSION:
        sh: grep '^version' momors/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/'
      STAGE: "{{.ROOT_DIR}}/dist/sdk/wasm"
      OUT: "{{.ROOT_DIR}}/dist/momo-sdk-wasm-{{.VERSION}}.zip"
    deps: [sdk:wasm]
    cmds:
      - rm -f "{{.OUT}}"
      - powershell -NoProfile -Command "Compress-Archive -Path '{{.STAGE}}/*' -DestinationPath '{{.OUT}}'"

  sdk:clean:
    desc: Clean SDK artifacts
    cmds:
      - rm -rf "{{.ROOT_DIR}}/dist/sdk"
      - rm -f "{{.ROOT_DIR}}/dist/momo-sdk-cpp-"*.zip
      - rm -f "{{.ROOT_DIR}}/dist/momo-sdk-csharp-"*.zip
      - rm -f "{{.ROOT_DIR}}/dist/momo-sdk-wasm-"*.zip

  clean:
    desc: Clean all build artifacts
    deps: [clean:rust, python:clean, clean:vscode, sdk:clean]

  clean:rust:
    dir: momors
    cmds:
      - cargo clean

  clean:vscode:
    dir: vscode-momo
    cmds:
      - rm -rf out/

  train:
    desc: Train model
    dir: momo-py
    cmds:
      - task train

  pyo3:sync:
    desc: Copy trained model files from dataset/ to momors-pyo3 crate
    vars:
      SRC: "{{.ROOT_DIR}}/dataset"
      DST: "{{.ROOT_DIR}}/momors/crates/momors-pyo3/python/momors_py"
    sources:
      - "{{.SRC}}/basic_data_4.mbm"
      - "{{.SRC}}/basic_data_5.mbm"
      - "{{.SRC}}/basic_data_7.mbm"
      - "{{.SRC}}/single_character_dic.tsv"
    generates:
      - "{{.DST}}/basic_data_4.mbm"
      - "{{.DST}}/basic_data_5.mbm"
      - "{{.DST}}/basic_data_7.mbm"
      - "{{.DST}}/single_character_dic.tsv"
    cmds:
      - cp "{{.SRC}}/basic_data_4.mbm" "{{.DST}}/"
      - cp "{{.SRC}}/basic_data_5.mbm" "{{.DST}}/"
      - cp "{{.SRC}}/basic_data_7.mbm" "{{.DST}}/"
      - cp "{{.SRC}}/single_character_dic.tsv" "{{.DST}}/"

  pyo3:
    desc: Build Python wheel from Rust bindings (maturin)
    deps: [pyo3:sync, rust:gen_tables]
    dir: momors/crates/momors-pyo3
    env:
    cmds:
      - uv build

  gui:
    desc: Build .NET GUI (release)
    deps: [rust]
    dir: momo-gui
    cmds:
      - dotnet publish -c Release

  editor:
    desc: Build .NET editor (release)
    dir: momo-editor
    deps: [rust]
    cmds:
      - dotnet publish -c Release

  dist:stage:
    desc: Stage artifacts for installer (rust + gui must be built first)
    vars:
      STAGE: "{{.ROOT_DIR}}/momo-installer/stage"
      RUST_BIN: "{{.ROOT_DIR}}/momors/target/release"
      GUI_BIN: "{{.ROOT_DIR}}/momo-gui/bin/Release/net10.0-windows/publish"
      EDITOR_BIN: "{{.ROOT_DIR}}/momo-editor/bin/Release/net10.0-windows/publish"
      DATA: "{{.ROOT_DIR}}/dataset"
    cmds:
      - rm -rf "{{.STAGE}}"
      - mkdir -p "{{.STAGE}}/bin" "{{.STAGE}}/data" "{{.STAGE}}/fonts" "{{.STAGE}}/licenses"
      - cp "{{.RUST_BIN}}/momo.exe"                        "{{.STAGE}}/bin/"
      - cp "{{.RUST_BIN}}/momors_ffi.dll"                 "{{.STAGE}}/bin/"
      - cp "{{.GUI_BIN}}"/*.* "{{.STAGE}}/bin/"
      - cp "{{.EDITOR_BIN}}"/*.* "{{.STAGE}}/bin/"
      # 辞書類（single_character_dic.tsv / person_name_dic.tsv）は
      # .mbm に同梱されるため配布しない
      - cp "{{.DATA}}/basic_data_4.mbm"               "{{.STAGE}}/data/"
      - cp "{{.DATA}}/basic_data_5.mbm"               "{{.STAGE}}/data/"
      - cp "{{.DATA}}/basic_data_7.mbm"               "{{.STAGE}}/data/"
      # エディタの点字セル表示用フォント（システムインストール）
      - cp "{{.ROOT_DIR}}/momo-installer/fonts/sixbraille.ttc" "{{.STAGE}}/fonts/"
      - cp "{{.ROOT_DIR}}/momo-installer/fonts/LICENSE-SixBraille.txt" "{{.STAGE}}/licenses/SixBraille-LICENSE.txt"

  dist:msi:
    desc: Build Windows installer (.msi) — requires WiX Toolset v3
    vars:
      VERSION:
        sh: grep '^version' momors/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/'
      STAGE: "{{.ROOT_DIR}}/momo-installer/stage"
      WXS: "{{.ROOT_DIR}}/momo-installer/main.wxs"
      OBJ: "{{.ROOT_DIR}}/momo-installer/momo.wixobj"
      OUT: "{{.ROOT_DIR}}/dist"
    deps:
      - rust
    cmds:
      - task: gui
      - task: editor
      - task: dist:stage
      - mkdir -p "{{.OUT}}"
      - candle -arch x64 "-dVersion={{.VERSION}}" "-dStageDir={{.STAGE}}" -out "{{.OBJ}}" "{{.WXS}}"
      # ICE69: FileAssociationMbr が [#MomoEditorExe] を参照する。ICE69 はフィーチャ間の
      # [#File] 参照を一律に弾くが、FileAssociation は Application の子フィーチャなので
      # MomoEditor.exe は必ず同時にインストールされる。誤検知のため抑止する。
      - light -ext WixUIExtension -sice:ICE69 -loc "C:/Program Files (x86)/WiX Toolset v3.14/SDK/wixui/WixUI_ja-jp.wxl" -out "{{.OUT}}/Momo-{{.VERSION}}-x64.msi" "{{.OBJ}}"

  dist:pyo3:
    desc: Build Python wheel and copy to dist/
    vars:
      OUT: "{{.ROOT_DIR}}/dist"
    deps: [pyo3]
    cmds:
      - mkdir -p "{{.OUT}}"
      - cp momors/crates/momors-pyo3/dist/*.whl "{{.OUT}}/"

  dist:python:
    desc: Build Python wheel and copy to dist/
    vars:
      OUT: "{{.ROOT_DIR}}/dist"
    deps: [python]
    cmds:
      - mkdir -p "{{.OUT}}"
      - cp momo-py/dist/*.whl "{{.OUT}}/"
      - cp momo-py/dist/*.tar.gz "{{.OUT}}/"

  dist:vscode:
    desc: Build VSCode extension and copy to dist/
    vars:
      OUT: "{{.ROOT_DIR}}/dist"
    deps: [vscode]
    cmds:
      - mkdir -p "{{.OUT}}"
      - cp vscode-momo/out/*.vsix "{{.OUT}}/"

  dist:models:
    desc: Copy trained model files to dist/
    vars:
      OUT: "{{.ROOT_DIR}}/dist/models"
      SRC: "{{.ROOT_DIR}}/dataset"
    sources:
      - "{{.SRC}}/basic_data_4.mbm"
      - "{{.SRC}}/basic_data_5.mbm"
      - "{{.SRC}}/basic_data_7.mbm"
      - "{{.SRC}}/single_character_dic.tsv"
    generates:
      - "{{.OUT}}/basic_data_4.mbm"
      - "{{.OUT}}/basic_data_5.mbm"
      - "{{.OUT}}/basic_data_7.mbm"
      - "{{.OUT}}/single_character_dic.tsv"
    cmds:
      - mkdir -p "{{.OUT}}"
      - cp "{{.SRC}}/basic_data_4.mbm" "{{.OUT}}/"
      - cp "{{.SRC}}/basic_data_5.mbm" "{{.OUT}}/"
      - cp "{{.SRC}}/basic_data_7.mbm" "{{.OUT}}/"
      - cp "{{.SRC}}/single_character_dic.tsv" "{{.OUT}}/"

  version:bump:
    desc: "Bump version across all components. Usage: task version:bump V=0.9.0"
    preconditions:
      - sh: '[ -n "{{.V}}" ]'
        msg: "Specify the new version: task version:bump V=<version>"
    cmds:
      - |
        V="{{.V}}"
        echo "Bumping version to $V"
        bumptoml() {
          sed "s/^version = \"[^\"]*\"/version = \"$V\"/" "$1" > "$1.tmp" && mv "$1.tmp" "$1"
        }
        bumptoml momors/Cargo.toml
        bumptoml momo-py/pyproject.toml
        bumptoml momors/crates/momors-pyo3/pyproject.toml
        node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('vscode-momo/package.json','utf8'));p.version='$V';fs.writeFileSync('vscode-momo/package.json',JSON.stringify(p,null,2)+'\n')"
        sed "s|<Version>[^<]*</Version>|<Version>$V</Version>|" momo-editor/MomoEditor.csproj > momo-editor/MomoEditor.csproj.tmp && mv momo-editor/MomoEditor.csproj.tmp momo-editor/MomoEditor.csproj

  version:check:
    desc: Verify all components share the version in momors/Cargo.toml
    vars:
      V:
        sh: grep '^version' momors/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/'
    cmds:
      - |
        EXPECTED="{{.V}}"
        FAIL=0
        check() {
          if [ "$2" = "$EXPECTED" ]; then
            printf "OK    %s (%s)\n" "$1" "$2"
          else
            printf "FAIL  %s: got '%s', expected '%s'\n" "$1" "$2" "$EXPECTED"
            FAIL=1
          fi
        }
        V_MOMO_PY="$(grep '^version' momo-py/pyproject.toml | sed 's/version = "\(.*\)"/\1/')"
        V_PYO3="$(grep '^version' momors/crates/momors-pyo3/pyproject.toml | sed 's/version = "\(.*\)"/\1/')"
        V_JSON="$(node -e "process.stdout.write(require('./vscode-momo/package.json').version)")"
        V_CSPROJ="$(grep '<Version>' momo-editor/MomoEditor.csproj | sed 's|.*<Version>||' | sed 's|</Version>.*||')"
        check "momo-py/pyproject.toml" "$V_MOMO_PY"
        check "momors-pyo3/pyproject.toml" "$V_PYO3"
        check "vscode-momo/package.json" "$V_JSON"
        check "momo-editor/MomoEditor.csproj" "$V_CSPROJ"
        exit $FAIL
