version: "3"

tasks:
  default:
    desc: Build all components (rust + python in parallel, then vscode + hugo)
    deps: [rust, python]
    cmds:
      - task: vscode
      # まだ Hugo サイトは公開していないため、ビルドはスキップする
      # - task: hugo

  rust:
    desc: Build Rust workspace (release)
    dir: momors
    cmds:
      - cargo build --release

  python:
    desc: Build Python package
    dir: momo-py
    cmds:
      - task

  python:test:
    desc: Run Python tests
    dir: momo-py
    cmds:
      - task test

  python:clean:
    desc: Clean Python build artifacts
    dir: momo-py
    cmds:
      - task clean

  vscode:
    desc: Compile VSCode extension
    dir: vscode-momo
    cmds:
      - pnpm vsce package -o out/

  hugo:
    desc: Build Hugo site
    dir: web
    cmds:
      - hugo --minify

  test:
    desc: Run all tests
    deps: [test:rust, python:test]

  test:rust:
    desc: Run Rust tests
    dir: momors
    vars:
      DATASET_DIR: "{{.ROOT_DIR}}/dataset"
    env:
      MOMO_DATASET_DIR: "{{.DATASET_DIR}}"
    cmds:
      - cargo test

  clean:
    desc: Clean all build artifacts
    deps: [clean:rust, python:clean, clean:vscode]

  clean:rust:
    dir: momors
    cmds:
      - cargo clean

  clean:vscode:
    dir: vscode-momo
    cmds:
      - rm -rf out/

  train:
    desc: Train model
    dir: momo-py
    cmds:
      - task train

  pyo3:venv:
    desc: Ensure momo-py venv exists (uv sync)
    dir: momo-py
    cmds:
      - uv sync

  pyo3:sync:
    desc: Copy trained model files from dataset/ to momors-pyo3 crate
    vars:
      SRC: "{{.ROOT_DIR}}/dataset"
      DST: "{{.ROOT_DIR}}/momors/crates/momors-pyo3"
    sources:
      - "{{.SRC}}/basic_data_4.mbm"
      - "{{.SRC}}/basic_data_5.mbm"
      - "{{.SRC}}/basic_data_7.mbm"
      - "{{.SRC}}/single_character_dic.tsv"
    generates:
      - "{{.DST}}/basic_data_4.mbm"
      - "{{.DST}}/basic_data_5.mbm"
      - "{{.DST}}/basic_data_7.mbm"
      - "{{.DST}}/single_character_dic.tsv"
    cmds:
      - cp "{{.SRC}}/basic_data_4.mbm" "{{.DST}}/"
      - cp "{{.SRC}}/basic_data_5.mbm" "{{.DST}}/"
      - cp "{{.SRC}}/basic_data_7.mbm" "{{.DST}}/"
      - cp "{{.SRC}}/single_character_dic.tsv" "{{.DST}}/"

  pyo3:
    desc: Build Python wheel from Rust bindings (maturin)
    deps: [pyo3:venv, pyo3:sync]
    dir: momors/crates/momors-pyo3
    env:
      VIRTUAL_ENV: "{{.ROOT_DIR}}/momo-py/.venv"
    cmds:
      - echo "{{.VIRTUAL_ENV}}"
      - maturin build --release

  pyo3:dev:
    desc: Install Rust bindings into momo-py venv (maturin develop)
    deps: [pyo3:venv, pyo3:sync]
    dir: momors/crates/momors-pyo3
    env:
      VIRTUAL_ENV: "{{.ROOT_DIR}}/momo-py/.venv"
    cmds:
      - maturin develop --release

  gui:
    desc: Build .NET GUI (release)
    dir: momo-gui
    cmds:
      - dotnet publish -c Release

  dist:stage:
    desc: Stage artifacts for installer (rust + gui must be built first)
    vars:
      STAGE: "{{.ROOT_DIR}}/momo-installer/stage"
      RUST_BIN: "{{.ROOT_DIR}}/momors/target/release"
      GUI_BIN: "{{.ROOT_DIR}}/momo-gui/bin/Release/net10.0-windows/publish"
      DATA: "{{.ROOT_DIR}}/dataset"
    cmds:
      - rm -rf "{{.STAGE}}"
      - mkdir -p "{{.STAGE}}/bin" "{{.STAGE}}/data"
      - cp "{{.RUST_BIN}}/momo.exe"                        "{{.STAGE}}/bin/"
      - cp "{{.GUI_BIN}}/momo-gui.exe"                    "{{.STAGE}}/bin/"
      - cp "{{.GUI_BIN}}/momo-gui.dll"                    "{{.STAGE}}/bin/"
      - cp "{{.GUI_BIN}}/momo-gui.deps.json"              "{{.STAGE}}/bin/"
      - cp "{{.GUI_BIN}}/momo-gui.runtimeconfig.json"     "{{.STAGE}}/bin/"
      - cp "{{.DATA}}/basic_data_4.mbm"               "{{.STAGE}}/data/"
      - cp "{{.DATA}}/basic_data_5.mbm"               "{{.STAGE}}/data/"
      - cp "{{.DATA}}/basic_data_7.mbm"               "{{.STAGE}}/data/"
      - cp "{{.DATA}}/japanese_braille.toml"           "{{.STAGE}}/data/"
      - cp "{{.DATA}}/single_character_dic.tsv"        "{{.STAGE}}/data/"

  dist:msi:
    desc: Build Windows installer (.msi) — requires WiX Toolset v3
    vars:
      VERSION:
        sh: grep '^version' momors/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/'
      STAGE: "{{.ROOT_DIR}}/momo-installer/stage"
      WXS: "{{.ROOT_DIR}}/momo-installer/main.wxs"
      OBJ: "{{.ROOT_DIR}}/momo-installer/momo.wixobj"
      OUT: "{{.ROOT_DIR}}/dist"
    deps:
      - rust
      - gui
    cmds:
      - task: dist:stage
      - mkdir -p "{{.OUT}}"
      - candle -arch x64 "-dVersion={{.VERSION}}" "-dStageDir={{.STAGE}}" -out "{{.OBJ}}" "{{.WXS}}"
      - light -ext WixUIExtension -loc "C:/Program Files (x86)/WiX Toolset v3.14/SDK/wixui/WixUI_ja-jp.wxl" -out "{{.OUT}}/Momo-{{.VERSION}}-x64.msi" "{{.OBJ}}"
