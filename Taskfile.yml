version: "3"

tasks:
  default:
    desc: Build all components (rust + python in parallel, then vscode + hugo)
    deps: [rust, python]
    cmds:
      - task: vscode
      - task: hugo

  rust:
    desc: Build Rust workspace (release)
    dir: momors
    cmds:
      - cargo build --release

  python:
    desc: Build Python package
    dir: momo-py
    cmds:
      - task

  python:test:
    desc: Run Python tests
    dir: momo-py
    cmds:
      - task test

  python:clean:
    desc: Clean Python build artifacts
    dir: momo-py
    cmds:
      - task clean

  vscode:
    desc: Compile VSCode extension
    dir: vscode-momo
    cmds:
      - pnpm vsce package -o out/

  hugo:
    desc: Build Hugo site
    dir: web
    cmds:
      - hugo --minify

  test:
    desc: Run all tests
    deps: [test:rust, python:test]

  test:rust:
    desc: Run Rust tests
    dir: momors
    vars:
      DATASET_DIR: "{{.ROOT_DIR}}/dataset"
    env:
      MOMO_DATASET_DIR: "{{.DATASET_DIR}}"
    cmds:
      - cargo test

  clean:
    desc: Clean all build artifacts
    deps: [clean:rust, python:clean, clean:vscode]

  clean:rust:
    dir: momors
    cmds:
      - cargo clean

  clean:vscode:
    dir: vscode-momo
    cmds:
      - rm -rf out/

  setup:
    desc: "git clone・momopy train 後の初期セットアップ"
    cmds:
      - task: python

  train:
    desc: Train the model (Python)
    dir: momo-py
    vars:
      DATASET_DIR: "{{.ROOT_DIR}}/dataset"
    env:
      MOMO_DATASET_DIR: "{{.DATASET_DIR}}"
    cmds:
      - uv run momopy createdata --raw '{{.DATASET_DIR}}/basic_raw.tsv'
      - uv run momopy train --tsv '{{.DATASET_DIR}}/basic_data.tsv' --window 4
      - uv run momopy train --tsv '{{.DATASET_DIR}}/basic_data.tsv' --window 5
      - uv run momopy train --tsv '{{.DATASET_DIR}}/basic_data.tsv' --window 7

  dist:msi:
    desc: Build Windows installer (.msi)
    dir: momors
    cmds:
      - cargo wix --package momors-cli --nocapture
