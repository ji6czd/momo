"together"   = { cell = "⠞⠛⠗", positions = ["wordsign"], shortform = true }      # tgr
"tomorrow"   = { cell = "⠞⠍", positions = ["wordsign"], shortform = true }       # tm
"tonight"    = { cell = "⠞⠝", positions = ["wordsign"], shortform = true }       # tn
"would"      = { cell = "⠺⠙", positions = ["wordsign"], shortform = true }       # wd
"your"       = { cell = "⠽⠗", positions = ["wordsign"], shortform = true }       # yr
"yourself"   = { cell = "⠽⠗⠋", positions = ["wordsign"], shortform = true }      # yrf
"yourselves" = { cell = "⠽⠗⠧⠎", positions = ["wordsign"], shortform = true }     # yrvs

# ============================================================
# Shortforms（略字の allowlist）
# Rules of Unified English Braille, Appendix 1（pdftotext 抽出・584語）。
# words: 語全体がこのリストにあるとき、その語中で shortform を使ってよい
#        （語尾に s / 's を付けた語も可）。小文字 a-z。
# plural_exceptions: s/'s を付けても shortform を使わない例外3語。
# ============================================================
[shortforms]
plural_exceptions = ["abouts", "almosts", "hims"]
words = [
  "about", "aboutface", "aboutfaced", "aboutfacer", "aboutfacing", "aboutturn", "aboutturned", "above",
  "aboveboard", "aboveground", "abovementioned", "according", "accordingly", "across", "aforesaid", "after",
  "afterbattle", "afterbirth", "afterbreakfast", "afterburn", "afterburned", "afterburner", "afterburning", "aftercare",
  "afterclap", "aftercoffee", "afterdamp", "afterdark", "afterdeck", "afterdinner", "afterflow", "aftergame",
  "afterglow", "afterguard", "afterhatch", "afterhatches", "afterhour", "afterlife", "afterlight", "afterlives",
  "afterlunch", "afterlunches", "aftermarket", "aftermatch", "aftermatches", "aftermath", "aftermeeting", "aftermidday",
  "aftermidnight", "aftermost", "afternoon", "afternoontea", "afterpain", "afterparties", "afterparty", "afterpiece",
  "afterplay", "aftersale", "afterschool", "aftersensation", "aftershave", "aftershock", "aftershow", "aftershower",
  "aftersupper", "aftertaste", "aftertax", "aftertaxes", "aftertea", "aftertheatre", "afterthought", "aftertime",
  "aftertreatment", "afterward", "afterword", "afterwork", "afterworld", "again", "against", "almost",
  "already", "also", "although", "altogether", "always", "apperceive", "apperceived", "apperceiver",
  "apperceiving", "archdeceiver", "because", "before", "beforehand", "befriend", "behind", "behindhand",
