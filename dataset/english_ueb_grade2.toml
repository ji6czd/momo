# ueb_english_grade2.toml
# UEB (Unified English Braille) grade 2（縮約あり）の変換テーブル。
# 仕様: momors/crates/momors-braille/docs/ueb-grade2-spec.md
#
# インベントリ（データ）だけをここに置き、適用ロジック（セル数最小化・位置制約・standing alone）は
# english_translator.rs のコードが持つ。拡張（lower signs / 頭字符・尾字符 / shortforms /
# 形態素境界）は原則このデータへ追加していく（機構を増やさない方針）。
# grade 1（無縮約）は ueb_english_grade1.toml（縮約セクションを持たない）。
[metadata]
name = "ueb_english_grade2"
displayname = "UEB English (Grade 2)"
author = "MOMO Project"

# 指示符
[indicators]
capital = "⠠"            # 大文字符（次の1文字）
capital_word = "⠠⠠"      # 大文字語符（大文字の連なり。終止符・空白・非英字まで）
capital_passage = "⠠⠠⠠"  # 大文字句符（3つ以上の並びが大文字。終止符まで）
capital_terminator = "⠠⠄" # 大文字終止符（語符・句符の効力をここで切る。ABCs = ⠠⠠⠁⠃⠉⠠⠄⠎）
number = "⠼"             # 数符
grade1 = "⠰"             # grade 1 記号符（次の1記号。"1a" = ⠼⠁⠰⠁、"b" = ⠰⠃）
grade1_word = "⠰⠰"       # grade 1 語符（その語全体を無縮約に。"Dobrljin" = ⠰⠰⠠⠙⠕⠃⠗⠇⠚⠊⠝。
                         # 空白で効力が切れるので終止符 ⠰⠄ は要らない＝grade 1 句符は未対応）

# 基本文字（grade 1）
[letters]
a = "⠁"
b = "⠃"
c = "⠉"
d = "⠙"
e = "⠑"
f = "⠋"
g = "⠛"
h = "⠓"
i = "⠊"
j = "⠚"
k = "⠅"
l = "⠇"
m = "⠍"
n = "⠝"
o = "⠕"
p = "⠏"
q = "⠟"
r = "⠗"
s = "⠎"
t = "⠞"
u = "⠥"
v = "⠧"
w = "⠺"
x = "⠭"
y = "⠽"
z = "⠵"

# 数字（数符のあと。1-9,0 = a-i,j）
[digits]
"1" = "⠁"
"2" = "⠃"
"3" = "⠉"
"4" = "⠙"
"5" = "⠑"
"6" = "⠋"
"7" = "⠛"
"8" = "⠓"
"9" = "⠊"
"0" = "⠚"

# 約物・記号（Rules of UEB 2024 §7 Punctuation / §3 General Symbols）
# 出典: https://iceb.org/wp-content/uploads/2025/10/Rules-of-Unified-English-Braille-2024.pdf
# 引用符は開き/閉じで形が違うので [quotes] に分ける（ここは1対1のもののみ）。
[punctuation]
# --- 基本約物 ---
"." = "⠲"
"," = "⠂"
";" = "⠆"
":" = "⠒"
"?" = "⠦"
"!" = "⠖"
"'" = "⠄"          # アポストロフィ（無方向の一重引用符）
"…" = "⠲⠲⠲"        # 省略記号（"..." は "." 3つで同じ列になる）
# --- ハイフン・ダッシュ・下線 ---
"-" = "⠤"          # ハイフン
"–" = "⠠⠤"         # ダッシュ（en dash）
"—" = "⠐⠠⠤"        # 長いダッシュ（em dash）
"_" = "⠨⠤"         # 下線（low line）
# --- 括弧 ---
"(" = "⠐⠣"
")" = "⠐⠜"
"[" = "⠨⠣"
"]" = "⠨⠜"
"{" = "⠸⠣"
"}" = "⠸⠜"
"<" = "⠈⠣"         # 山括弧／小なり（§3.17 と同セル）
">" = "⠈⠜"
# --- スラッシュ ---
"/" = "⠸⠌"         # solidus
"\\" = "⠸⠡"        # reverse solidus（backslash）
# --- 記号（§3）---
"@" = "⠈⠁"
"&" = "⠈⠯"
"*" = "⠐⠔"
"#" = "⠸⠹"
"•" = "⠸⠲"
"^" = "⠈⠢"
"~" = "⠈⠔"
"%" = "⠨⠴"
"°" = "⠘⠚"
"©" = "⠘⠉"
"®" = "⠘⠗"
"™" = "⠘⠞"
"§" = "⠘⠎"
"¶" = "⠘⠏"
# --- 通貨（§3.10）---
"$" = "⠈⠎"
"¢" = "⠈⠉"
"€" = "⠈⠑"
"£" = "⠈⠇"
"¥" = "⠈⠽"
# --- 演算・比較（§3.17）---
"+" = "⠐⠖"
"=" = "⠐⠶"
"×" = "⠐⠦"
"÷" = "⠐⠌"
"−" = "⠐⠤"        # 負号（U+2212。ASCII の "-" はハイフン）

# 引用符。開き/閉じは文脈で決める（直前が空白・行頭・開き括弧なら開き、でなければ閉じ）。
# 既定は1セルの非特定引用符 ⠦/⠴（§7.6 の用例が二重引用符にこれを使う）。
[quotes]
"\"" = { open = "⠦", close = "⠴" }
"“"  = { open = "⠦", close = "⠴" }
"”"  = { open = "⠦", close = "⠴" }
"‘"  = { open = "⠠⠦", close = "⠠⠴" }
"’"  = { open = "⠠⠦", close = "⠠⠴" }

# 縮約。positions = 適用できる語中の位置（複数可・いずれか一致で適用）:
#   always     語中どこでも
#   noninitial 語頭でない（ing 専用）
#   initial    語頭＋後続が文字（be/con/dis）
#   medial     両側が文字＝語中（ea/bb/cc/ff/gg）
#   wordsign   単独で1語
# lower = true は下方記号（dot 1/4 を含まない）。lower wordsign が下方約物に接触する
# ときは縮約しない（Phase 2a 近似）。
[contractions]
# --- strong contraction（always / wordsign 兼）---
"and"  = { cell = "⠯", positions = ["always"] }
"for"  = { cell = "⠿", positions = ["always"] }
"of"   = { cell = "⠷", positions = ["always"] }
"the"  = { cell = "⠮", positions = ["always"] }
"with" = { cell = "⠾", positions = ["always"] }

# --- strong groupsign（always。ing だけ語頭不可）---
"ch"  = { cell = "⠡", positions = ["always"] }
"gh"  = { cell = "⠣", positions = ["always"] }
"sh"  = { cell = "⠩", positions = ["always"] }
"th"  = { cell = "⠹", positions = ["always"] }
"wh"  = { cell = "⠱", positions = ["always"] }
"ed"  = { cell = "⠫", positions = ["always"] }
"er"  = { cell = "⠻", positions = ["always"] }
"ou"  = { cell = "⠳", positions = ["always"] }
"ow"  = { cell = "⠪", positions = ["always"] }
"ar"  = { cell = "⠜", positions = ["always"] }
"st"  = { cell = "⠌", positions = ["always"] }
"ing" = { cell = "⠬", positions = ["noninitial"] }

# --- alphabetic wordsign（wordsign）---
"but"       = { cell = "⠃", positions = ["wordsign"] }
"can"       = { cell = "⠉", positions = ["wordsign"] }
"do"        = { cell = "⠙", positions = ["wordsign"] }
"every"     = { cell = "⠑", positions = ["wordsign"] }
"from"      = { cell = "⠋", positions = ["wordsign"] }
"go"        = { cell = "⠛", positions = ["wordsign"] }
"have"      = { cell = "⠓", positions = ["wordsign"] }
"just"      = { cell = "⠚", positions = ["wordsign"] }
"knowledge" = { cell = "⠅", positions = ["wordsign"] }
"like"      = { cell = "⠇", positions = ["wordsign"] }
"more"      = { cell = "⠍", positions = ["wordsign"] }
"not"       = { cell = "⠝", positions = ["wordsign"] }
"people"    = { cell = "⠏", positions = ["wordsign"] }
"quite"     = { cell = "⠟", positions = ["wordsign"] }
"rather"    = { cell = "⠗", positions = ["wordsign"] }
"so"        = { cell = "⠎", positions = ["wordsign"] }
"that"      = { cell = "⠞", positions = ["wordsign"] }
"us"        = { cell = "⠥", positions = ["wordsign"] }
"very"      = { cell = "⠧", positions = ["wordsign"] }
"will"      = { cell = "⠺", positions = ["wordsign"] }
"it"        = { cell = "⠭", positions = ["wordsign"] }
"you"       = { cell = "⠽", positions = ["wordsign"] }
"as"        = { cell = "⠵", positions = ["wordsign"] }

# --- strong wordsign（wordsign。セルは strong groupsign と共有）---
"child" = { cell = "⠡", positions = ["wordsign"] }
"shall" = { cell = "⠩", positions = ["wordsign"] }
"this"  = { cell = "⠹", positions = ["wordsign"] }
"which" = { cell = "⠱", positions = ["wordsign"] }
"out"   = { cell = "⠳", positions = ["wordsign"] }
"still" = { cell = "⠌", positions = ["wordsign"] }

# ============================================================
# Phase 2a: lower signs（下方の縮約。dot 1/4 を含まない）
# 仕様: docs/ueb-grade2-lower-signs.md
# ============================================================

# --- lower groupsign（be/con/dis は語頭のみ、ea/bb/cc/ff/gg は語中のみ、en/in は無制限）---
#
# be / con / dis は UEB では「語の第一音節であるとき」しか groupsign にできない。
# 音節は綴りから決まらない（become は可・benzene は不可）ので、既定は不許可とし、
# initial_stems に挙げた語幹で始まる語だけ解禁する。誤らない側に倒し、知識をデータで足していく方針。
# リストは随時追加してよい（追加するほど縮約率が上がるだけで、正しさは壊れない）。
"be" = { cell = "⠆", positions = [
    "wordsign",
    "initial",
], lower = true, avoid_lower_punct = true, initial_stems = [
    "beatrice", "beatrix", "begotten", "bein", "belinda",
    "bedazzle", "bedevil", "befriended", "begonia", "behemoth", "being", "beneficent", "benevolence", "benumb", "beta",
    "becom", "became", "begin", "began", "begun",
    "behav", "behold", "believ", "belief", "belong", "beloved",
    "bequeath", "bereav", "beseech", "bestow", "betray", "beware", "bewild",
    "beatitude", "bedraggl", "benight", "benign", "berat",
    "because", "before", "behind", "below", "beneath", "beside", "between", "beyond",
] }
"con" = { cell = "⠒", positions = ["initial"], lower = true, initial_stems = [
    "conestoga", "congo",
    "concept", "congeal", "congratulate", "cont", "contradistinction",
    "conceiv", "concern", "conclud", "condition", "conduct", "congee", "congru",
    "confer", "confirm", "conflict", "confus", "congenial", "congress",
    "connect", "conquer", "consent", "conserv", "consider", "consist",
    "constant", "construct", "consult", "consum",
    "contact", "contain", "content", "contest", "context", "continu",
    "contract", "contrast", "contribut", "control",
    "convention", "convers", "convert", "convey", "convinc",
] }
"dis" = { cell = "⠲", positions = ["initial"], lower = true, initial_stems = [
    "discipl", "disingenuous", "dist",
    "disaster", "disco", "disharmony", "dissect",
    "disagree", "disappear", "disappoint", "disbelief", "disconnect",
    "discover", "discuss", "disease", "dishonest", "dishonor", "dishonour",
    "dislike", "dismal", "dismay", "dismiss",
    "display", "dispos", "disput", "disrupt",
    "distanc", "distant", "distinct", "district", "distribut", "distrust", "disturb",
] }
"en"  = { cell = "⠢", positions = ["always"], lower = true }
"in"  = { cell = "⠔", positions = ["wordsign", "always"], lower = true, needs_upper_dot = true }
"ea"  = { cell = "⠂", positions = ["medial"], lower = true }
"bb"  = { cell = "⠆", positions = ["medial"], lower = true }
"cc"  = { cell = "⠒", positions = ["medial"], lower = true }
"ff"  = { cell = "⠖", positions = ["medial"], lower = true }
"gg"  = { cell = "⠶", positions = ["medial"], lower = true }

# --- lower wordsign（単独で1語。下方約物接触時は縮約しない）---
"his"    = { cell = "⠦", positions = ["wordsign"], lower = true, avoid_lower_punct = true }
"was"    = { cell = "⠴", positions = ["wordsign"], lower = true, avoid_lower_punct = true }
"were"   = { cell = "⠶", positions = ["wordsign"], lower = true, avoid_lower_punct = true }
"enough" = { cell = "⠢", positions = ["wordsign"], lower = true }

# ============================================================
# Phase 3: 頭字符・尾字符（2セルの縮約）
# 仕様: docs/ueb-grade2-initial-final.md
# 機構は増えない（頭字符=always / 尾字符=noninitial、2セルは cell 文字列がそのまま対応）。
# ============================================================

# --- 頭字符 initial-letter contraction: dot 5（⠐）。2セル目は語の先頭文字/先頭縮約 ---
"day"       = { cell = "⠐⠙", positions = ["always"] }
# ever は e / i の直後では使わない（§10.7.4。believer = ⠆⠇⠊⠑⠧⠻）
"ever"      = { cell = "⠐⠑", positions = ["always"], not_after = "ei" }
"father"    = { cell = "⠐⠋", positions = ["always"] }
"here"      = { cell = "⠐⠓", positions = ["always"] }
"know"      = { cell = "⠐⠅", positions = ["always"] }
"lord"      = { cell = "⠐⠇", positions = ["always"] }
"mother"    = { cell = "⠐⠍", positions = ["always"] }
"name"      = { cell = "⠐⠝", positions = ["always"] }
"one"       = { cell = "⠐⠕", positions = ["always"] }
"part"      = { cell = "⠐⠏", positions = ["always"] }
"question"  = { cell = "⠐⠟", positions = ["always"] }
"right"     = { cell = "⠐⠗", positions = ["always"] }
"some"      = { cell = "⠐⠎", positions = ["always"] }
"time"      = { cell = "⠐⠞", positions = ["always"] }
"under"     = { cell = "⠐⠥", positions = ["always"] }
"work"      = { cell = "⠐⠺", positions = ["always"] }
"young"     = { cell = "⠐⠽", positions = ["always"] }
# 先頭が縮約セルのもの
"there"     = { cell = "⠐⠮", positions = ["always"] }
"character" = { cell = "⠐⠡", positions = ["always"] }
"through"   = { cell = "⠐⠹", positions = ["always"] }
"where"     = { cell = "⠐⠱", positions = ["always"] }
"ought"     = { cell = "⠐⠳", positions = ["always"] }

# --- 頭字符: dots 45（⠘）---
"upon"  = { cell = "⠘⠥", positions = ["always"] }
"word"  = { cell = "⠘⠺", positions = ["always"] }
"these" = { cell = "⠘⠮", positions = ["always"] }
"those" = { cell = "⠘⠹", positions = ["always"] }
"whose" = { cell = "⠘⠱", positions = ["always"] }

# --- 頭字符: dots 456（⠸）---
"cannot" = { cell = "⠸⠉", positions = ["always"] }
"had"    = { cell = "⠸⠓", positions = ["always"] }
"many"   = { cell = "⠸⠍", positions = ["always"] }
"spirit" = { cell = "⠸⠎", positions = ["always"] }
"world"  = { cell = "⠸⠺", positions = ["always"] }
"their"  = { cell = "⠸⠮", positions = ["always"] }

# --- 尾字符 final-letter groupsign: dots 46（⠨）。語頭不可・単独不可 ---
"ound" = { cell = "⠨⠙", positions = ["noninitial"] }
"ance" = { cell = "⠨⠑", positions = ["noninitial"] }
"sion" = { cell = "⠨⠝", positions = ["noninitial"] }
"less" = { cell = "⠨⠎", positions = ["noninitial"] }
"ount" = { cell = "⠨⠞", positions = ["noninitial"] }

# --- 尾字符: dots 56（⠰）---
"ence" = { cell = "⠰⠑", positions = ["noninitial"] }
"ong"  = { cell = "⠰⠛", positions = ["noninitial"] }
"ful"  = { cell = "⠰⠇", positions = ["noninitial"] }
"tion" = { cell = "⠰⠝", positions = ["noninitial"] }
"ness" = { cell = "⠰⠎", positions = ["noninitial"] }
"ment" = { cell = "⠰⠞", positions = ["noninitial"] }
"ity"  = { cell = "⠰⠽", positions = ["noninitial"] }

# ============================================================
# Phase 4a: shortforms（略字。75件）
# 仕様: docs/ueb-grade2-shortforms.md
# 単独で1語のときだけ適用（長い語の一部としての適用＝Appendix 1 は Phase 4b）。
# セルは略記を grade 2 で書いたもの（例: shd → sh + d = ⠩⠙）。
# ============================================================

"about"      = { cell = "⠁⠃", positions = ["wordsign"], shortform = true }       # ab
"above"      = { cell = "⠁⠃⠧", positions = ["wordsign"], shortform = true }      # abv
"according"  = { cell = "⠁⠉", positions = ["wordsign"], shortform = true }       # ac
"across"     = { cell = "⠁⠉⠗", positions = ["wordsign"], shortform = true }      # acr
"after"      = { cell = "⠁⠋", positions = ["wordsign"], shortform = true }       # af
"afternoon"  = { cell = "⠁⠋⠝", positions = ["wordsign"], shortform = true }      # afn
"afterward"  = { cell = "⠁⠋⠺", positions = ["wordsign"], shortform = true }      # afw
"again"      = { cell = "⠁⠛", positions = ["wordsign"], shortform = true }       # ag
"against"    = { cell = "⠁⠛⠌", positions = ["wordsign"], shortform = true }      # agst（st）
"almost"     = { cell = "⠁⠇⠍", positions = ["wordsign"], shortform = true }      # alm
"already"    = { cell = "⠁⠇⠗", positions = ["wordsign"], shortform = true }      # alr
"also"       = { cell = "⠁⠇", positions = ["wordsign"], shortform = true }       # al
"although"   = { cell = "⠁⠇⠹", positions = ["wordsign"], shortform = true }      # alth（th）
"altogether" = { cell = "⠁⠇⠞", positions = ["wordsign"], shortform = true }      # alt
"always"     = { cell = "⠁⠇⠺", positions = ["wordsign"], shortform = true }      # alw
"because"    = { cell = "⠆⠉", positions = ["wordsign"], shortform = true }       # bec（be）
"before"     = { cell = "⠆⠋", positions = ["wordsign"], shortform = true }       # bef（be）
"behind"     = { cell = "⠆⠓", positions = ["wordsign"], shortform = true }       # beh（be）
"below"      = { cell = "⠆⠇", positions = ["wordsign"], shortform = true }       # bel（be）
"beneath"    = { cell = "⠆⠝", positions = ["wordsign"], shortform = true }       # ben（be）
"beside"     = { cell = "⠆⠎", positions = ["wordsign"], shortform = true }       # bes（be）
"between"    = { cell = "⠆⠞", positions = ["wordsign"], shortform = true }       # bet（be）
"beyond"     = { cell = "⠆⠽", positions = ["wordsign"], shortform = true }       # bey（be）
"blind"      = { cell = "⠃⠇", positions = ["wordsign"], shortform = true, free = "initial", not_before_vowel = true }   # bl
"braille"    = { cell = "⠃⠗⠇", positions = ["wordsign"], shortform = true, free = "anywhere" }                          # brl
"children"   = { cell = "⠡⠝", positions = ["wordsign"], shortform = true, free = "anywhere", not_before_vowel = true }  # chn（ch）
"conceive"   = { cell = "⠒⠉⠧", positions = ["wordsign"], shortform = true }      # concv（con）
"conceiving" = { cell = "⠒⠉⠧⠛", positions = ["wordsign"], shortform = true }     # concvg（con）
"could"      = { cell = "⠉⠙", positions = ["wordsign"], shortform = true }       # cd
"deceive"    = { cell = "⠙⠉⠧", positions = ["wordsign"], shortform = true }      # dcv
"deceiving"  = { cell = "⠙⠉⠧⠛", positions = ["wordsign"], shortform = true }     # dcvg
"declare"    = { cell = "⠙⠉⠇", positions = ["wordsign"], shortform = true }      # dcl
"declaring"  = { cell = "⠙⠉⠇⠛", positions = ["wordsign"], shortform = true }     # dclg
"either"     = { cell = "⠑⠊", positions = ["wordsign"], shortform = true }       # ei
"first"      = { cell = "⠋⠌", positions = ["wordsign"], shortform = true, free = "initial", not_before_vowel = true }   # fst（st）
"friend"     = { cell = "⠋⠗", positions = ["wordsign"], shortform = true, free = "initial", not_before_vowel = true }   # fr
"good"       = { cell = "⠛⠙", positions = ["wordsign"], shortform = true, free = "initial", not_before_vowel = true }   # gd
"great"      = { cell = "⠛⠗⠞", positions = ["wordsign"], shortform = true, free = "anywhere" }                          # grt
"herself"    = { cell = "⠓⠻⠋", positions = ["wordsign"], shortform = true }      # herf（er）
"him"        = { cell = "⠓⠍", positions = ["wordsign"], shortform = true }       # hm
"himself"    = { cell = "⠓⠍⠋", positions = ["wordsign"], shortform = true }      # hmf
"immediate"  = { cell = "⠊⠍⠍", positions = ["wordsign"], shortform = true }      # imm
"its"        = { cell = "⠭⠎", positions = ["wordsign"], shortform = true }       # xs
"itself"     = { cell = "⠭⠋", positions = ["wordsign"], shortform = true }       # xf
"letter"     = { cell = "⠇⠗", positions = ["wordsign"], shortform = true, free = "initial", not_before_vowel = true }   # lr
