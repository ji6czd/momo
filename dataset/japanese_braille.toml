# japanese_braille.toml
# 日本語点字変換テーブルとフラグ定義
# pybraille.py (momo-py) を元に作成

# ==============================================================
# フラグ定義
# ==============================================================
# フラグの ON/OFF 条件と関連記号を定義する。
# いつ explicit_exit を挿入するかはコードが判断する。

[flags.digit]
trigger_class = ["digit", "fullwidth_digit"]
entry_prefix  = "⠼"          # 数字が始まるときに挿入
explicit_exit = "⠤"          # 点字が数字セルと衝突するとき強制終端
exempt_chars  = [".", ","]   # 小数点・桁区切りは数字モードを終了させない

[flags.foreign_word]
trigger_class = ["ascii_alpha"]
entry_prefix  = "⠰"          # 英字列が始まるときに挿入
exit_suffix   = "⠀"          # 日本語文字に戻るとき末尾に挿入

[flags.capital]
trigger_class       = ["ascii_upper"]
entry_prefix        = "⠠"    # 大文字1文字のとき
double_entry_prefix = "⠠⠠"  # 次の文字も大文字のとき（全大文字語）

