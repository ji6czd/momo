# --------------------------------------------------------------
# 句読点・記号
# class = この記号自身の分類（省略時は無分類）
# 前後のスペースはセルには書かず、すべて [transitions] でクラス単位に宣言する。
# jp    : foreign_word フラグが OFF のときに参照（日本語文脈）
# latin : foreign_word フラグが ON  のときに参照（英語文脈）
# 同じ記号でも文脈によって点字パターンが変わることがある。
# --------------------------------------------------------------

[table.punct]
# このテーブルで使うクラス名の宣言。セルの class / [transitions] に現れる名前は
# ここに宣言されていないとロードエラーになる（typo 検出のため）。
# kana / digit / latin / none は予約名（テーブル所属から暗黙に決まる）。
# 宣言はできないが、[transitions] の条件には使える。
# 語彙: stop（文末記号） / pause（読点類） / open（開き括弧） / close（閉じ括弧）
#       / inline（前後をあける記号）
classes = ["stop", "pause", "open", "close", "inline"]

[table.punct.jp]
"　" = "⠀⠀"
"。" = { braille = "⠲", class = "stop" }
