# japanese_grade1_braille.toml
# 日本語点字変換テーブルとフラグ定義

[metadata]
name = "japanese_grade1"
displayname = "日本語１級"
author = "MOMO Project"

# ==============================================================
# フラグ定義
# ==============================================================
# フラグの ON/OFF 条件と関連記号を定義する。
# いつ explicit_exit を挿入するかはコードが判断する。

[flags.digit]
entry_prefix = "⠼"        # 数字が始まるときに挿入
explicit_exit = "⠤"       # 点字が数字セルと衝突するとき強制終端
exempt_chars = [".", ","] # 小数点・桁区切りは数字モードを終了させない

[flags.foreign_word]
entry_prefix = "⠰" # 英字列が始まるときに挿入
exit_suffix = ""   # 終了マーカー記号（未使用）。境界スペースは [transitions] で宣言する

[flags.capital]
entry_prefix = "⠠"         # 大文字1文字のとき
double_entry_prefix = "⠠⠠" # 次の文字も大文字のとき（全大文字語）

# ==============================================================
# クラス遷移
# ==============================================================
# スペースの挿入はすべてここで宣言する（セル側には書かない）。
# 「A -> B」= クラス A の文字からクラス B の文字に切り替わる境界に
# 挿入する点字スペース数。
# クラス名は予約クラス（kana / digit / latin / none）か、
# [table.punct] classes に宣言した句読点クラス。
# - 片側にワイルドカード「*」が使える（「stop -> *」= 句点類のあとは常に）
# - 完全一致のペアがワイルドカードより優先（「stop -> stop」= 0 のような明示抑制）
# - 「stop -> *」と「* -> inline」が同時に当たる場合は大きい方（max）
# - 宣言されていないペアには何も挿入しない
# - 直前の出力がすでに点字スペースで終わっていれば挿入しない（二重防止）
# - テキストの先頭・末尾では発火しない（次の文字がない場所にスペースは不要）

[transitions]
# 文字種境界
"kana -> latin" = 1 # かな→英字: 外字符（⠰）の前を一マスあける
"latin -> kana" = 1 # 英字→かな: 語の切れ目を一マスあける
# 句点類（。！？）: あとを二マスあける。連続・閉じ括弧の前は除く
"stop -> *" = 2
"stop -> stop" = 0
"stop -> close" = 0
# 読点類（、・：％～）: あとを一マスあける。連続・句点・閉じ括弧の前は除く
"pause -> *" = 1
"pause -> pause" = 0
"pause -> stop" = 0
"pause -> close" = 0
# 前後一マスの記号（… → ←）
"* -> inline" = 1
"inline -> *" = 1
"inline -> stop" = 0
"inline -> pause" = 0
"inline -> close" = 0

