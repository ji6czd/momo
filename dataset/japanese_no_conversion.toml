# japanese_no_conversion_braille.toml
# 日本語点字変換テーブルとフラグ定義

[metadata]
name = "japanese_no_conversion"
displayname = "日本語無変換"
author = "MOMO Project"

# ==============================================================
# フラグ定義
# ==============================================================
# フラグの ON/OFF 条件と関連記号を定義する。
# いつ explicit_exit を挿入するかはコードが判断する。

[flags.digit]
[flags.foreign_word]
[flags.capital]

# ==============================================================
# クラス遷移
# ==============================================================
# スペースの挿入はすべてここで宣言する（セル側には書かない）。

# クラス名はドット区切りのクラスパス（プレフィックス参照・特異度max）。
# 詳細は japanese_grade1_braille.toml のヘッダコメント参照。
[transitions]
# 文字種境界
# "kana -> latin" = 1 # かな→英字: 外字符（⠰）の前を一マスあける
# "latin -> kana" = 1 # 英字→かな: 語の切れ目を一マスあける
# 半角記号と全角の繊維
"punct.latin.stop -> kana" = 1
"punct.latin.pause -> kana" = 1
"punct.latin.inline -> kana" = 1
"punct.latin.open -> kana" = 0
"punct.latin.close -> kana" = 0
# 句点類（。！？）: あとを二マスあける。連続・閉じ括弧の前は除く
"punct.jp.stop -> *" = 2
"punct.jp.stop -> punct.jp.stop" = 0
"punct.jp.stop -> punct.jp.close" = 0
# 読点類（、・：％～）: あとを一マスあける。連続・句点・閉じ括弧の前は除く
"punct.jp.pause -> *" = 1
"punct.jp.pause -> punct.jp.pause" = 0
"punct.jp.pause -> punct.jp.stop" = 0
"punct.jp.pause -> punct.jp.close" = 0
# 前後一マスの記号（…）
"* -> punct.jp.inline" = 1
"punct.jp.inline -> *" = 1
# 句読点の前は続ける
"punct.jp.inline -> punct.jp.stop" = 0
"punct.jp.inline -> punct.jp.pause" = 0
"punct.jp.inline -> punct.jp.close" = 0
# 閉じた括弧のあとに開き括弧が続く場合は一マスあける
"punct.jp.close -> punct.jp.open" = 1

