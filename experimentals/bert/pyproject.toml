[project]
name = "bert"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "KIRIAKE Masanori", email = "seiken@rd01.net" }]
requires-python = ">=3.13"
dependencies = [
    "momo-train",
    "momors-py",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
export_data = "bert.export_data:main"
make_kit = "bert.make_kit:main"
step6_extract = "bert.step6_extract:main"
step7_head = "bert.step7_head:main"
step8_predict = "bert.step8_predict:main"
step9_finetune = "bert.step9_finetune:main"
step10_infer = "bert.step10_infer:main"
step11_audit = "bert.step11_audit:main"
export_onnx = "bert.export_onnx:main"
step12_rust_eval = "bert.step12_rust_eval:main"


[tool.uv.sources]
momo-train = { path = "../../momo-train", editable = true }
momors-py = { path = "work/wheels/momors_py-0.11.2-cp313-abi3-win_amd64.whl" }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
