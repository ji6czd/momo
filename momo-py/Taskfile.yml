version: "3"

vars:
  DATASET_DIR: "{{.TASKFILE_DIR}}/../dataset"
  JOBS: '{{.JOBS | default "8"}}'

tasks:
  default:
    desc: Build momo-py package
    cmds:
      - mkdir -p src/momo_py/resources
      - cp {{.DATASET_DIR}}/japanese_grade1_braille.toml src/momo_py/resources/
      - cp {{.DATASET_DIR}}/basic_data*.zip src/momo_py/resources/
      - cp {{.DATASET_DIR}}/single_character_dic.tsv src/momo_py/resources/
      - uv build

  createdata:
    desc: Create training data from raw TSV
    cmds:
      - uv run momopy createdata --raw '{{.DATASET_DIR}}/basic_raw.tsv'
      - uv run makedic {{.DATASET_DIR}}/basic_data.tsv {{.DATASET_DIR}}/single_character_dic.tsv

  train:
    desc: Train the model (Python)
    deps: [createdata]
    cmds:
      - uv run momopy train --tsv '{{.DATASET_DIR}}/basic_data.tsv' --window 4 --jobs {{.JOBS}}
      - uv run momopy train --tsv '{{.DATASET_DIR}}/basic_data.tsv' --window 5 --jobs {{.JOBS}}
      - uv run momopy train --tsv '{{.DATASET_DIR}}/basic_data.tsv' --window 7 --jobs {{.JOBS}}

  test:
    desc: Run Python tests
    env:
      MOMO_DATASET_DIR: "{{.DATASET_DIR}}"
    cmds:
      - uv run pytest

  clean:
    desc: Clean Python build artifacts
    cmds:
      - rm -rf dist/
  publish:google:
    desc: Publish the package to Google Artifact Registry
    deps:
      - default
    cmds:
      - uv publish --publish-url https://asia-northeast1-python.pkg.dev/neomomo/momo-py/ --username oauth2accesstoken --keyring-provider subprocess
