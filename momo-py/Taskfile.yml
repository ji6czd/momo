version: "3"

vars:
  DATASET_DIR: "{{.TASKFILE_DIR}}/../dataset"
  JOBS: '{{.JOBS | default "8"}}'

tasks:
  default:
    desc: Training and build model data
    tasks:
      - createdata
      - train

  createdata:
    desc: Create training data from raw TSV
    cmds:
      - uv run trainer createdata --raw '{{.DATASET_DIR}}/basic_raw.tsv'
      - uv run makedic {{.DATASET_DIR}}/basic_data.tsv {{.DATASET_DIR}}/single_character_dic.tsv

  train:
    desc: Train the model (Python)
    deps: [createdata]
    cmds:
      - uv run trainer train --tsv '{{.DATASET_DIR}}/basic_data.tsv' --name-dict '{{.DATASET_DIR}}/person_name_dic.tsv' --window 4 --jobs {{.JOBS}}
      - uv run trainer train --tsv '{{.DATASET_DIR}}/basic_data.tsv' --name-dict '{{.DATASET_DIR}}/person_name_dic.tsv' --window 5 --jobs {{.JOBS}}
      - uv run trainer train --tsv '{{.DATASET_DIR}}/basic_data.tsv' --name-dict '{{.DATASET_DIR}}/person_name_dic.tsv' --window 7 --jobs {{.JOBS}}

  test:
    desc: Run Python tests
    env:
      MOMO_DATASET_DIR: "{{.DATASET_DIR}}"
    cmds:
      - uv run pytest

  clean:
    desc: Clean Python build artifacts
    cmds:
      - rm -rf dist/
