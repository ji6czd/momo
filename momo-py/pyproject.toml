[project]
name = "momo-py"
version = "0.8.7"
description = "A tool to convert Japanese text to Braille using machine learning."
readme = "README.md"
authors = [
    { name = "KIRIAKE Masanori", email = "seiken@rd01.net" }
]
requires-python = ">=3.13"
dependencies = [
    "scikit-learn",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
[project.scripts]
momopy = "momo_py.cli:main"
lookup = "momo_py.lookup:main"
makedic = "momo_py.makedic:main"
momo-server = "momo_py.server:main"

[[tool.mypy.overrides]]
module = ["pycrfsuite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
