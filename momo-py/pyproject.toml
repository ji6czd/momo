[project]
name = "momo-py"
version = "0.10.0"
description = "Training tool for the MOMO Japanese-to-Braille ML models (reading/boundary models and .mbm export)."
readme = "README.md"
authors = [{ name = "KIRIAKE Masanori", email = "seiken@rd01.net" }]
requires-python = ">=3.13"
# 学習・エクスポートで直接 import するものを明示する
# （scikit-learn の推移的依存に頼らない）。
dependencies = [
    "scikit-learn",
    "joblib",
    "numpy",
    "scipy",
    "lightgbm>=4.7.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
[project.scripts]
trainer = "momo_py.cli:main"
lookup = "momo_py.lookup:main"
makedic = "momo_py.makedic:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
