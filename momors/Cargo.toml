[workspace]
resolver = "3"
members = [
    "crates/momors-core",
    "crates/momors-braille",
    "crates/momors-cli",
    "crates/momors-ffi",
    "crates/momors-pyo3",
    "crates/momors-wasm",
]
# momors-pyo3 は maturin 経由でビルドするため通常の cargo build から除外する
# momors-wasm は wasm-pack 経由でビルドするため通常の cargo build から除外する
default-members = [
    "crates/momors-core",
    "crates/momors-braille",
    "crates/momors-cli",
    "crates/momors-ffi",
]

[workspace.package]
version = "0.10.1"
edition = "2024"
authors = ["KIRIAKE Masanori <seiken@rd01.net>"]
license = "BSD-3-Clause"

[workspace.dependencies]
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
byteorder = "1.5"
momors-core = { path = "crates/momors-core"}
momors-braille = { path = "crates/momors-braille"}
