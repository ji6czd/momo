# english_ueb_grade1.toml
# UEB (Unified English Braille) grade 1（無縮約）の変換テーブル。
# letters / 大文字符 / 数符 / 約物のみ。縮約（[contractions]）を持たない。
# grade 2（縮約あり）は english_ueb_grade2.toml。インベントリは grade2 と共通。
[metadata]
name = "english_ueb_grade1"
displayname = "UEB English (Grade 1)"
author = "MOMO Project"

[indicators]
capital = "⠠"            # 大文字符（次の1文字）
capital_word = "⠠⠠"      # 大文字語符（大文字の連なり。終止符・空白・非英字まで）
capital_passage = "⠠⠠⠠"  # 大文字句符（3つ以上の並びが大文字。終止符まで）
capital_terminator = "⠠⠄" # 大文字終止符（語符・句符の効力をここで切る。ABCs = ⠠⠠⠁⠃⠉⠠⠄⠎）
number = "⠼"             # 数符
grade1 = "⠰"             # grade 1 記号符（次の1記号。"1a" = ⠼⠁⠰⠁）
grade1_word = "⠰⠰"       # grade 1 語符

# 基本文字（grade 1）
[letters]
a = "⠁"
b = "⠃"
c = "⠉"
d = "⠙"
e = "⠑"
f = "⠋"
g = "⠛"
h = "⠓"
i = "⠊"
j = "⠚"
k = "⠅"
l = "⠇"
m = "⠍"
n = "⠝"
o = "⠕"
p = "⠏"
q = "⠟"
r = "⠗"
s = "⠎"
t = "⠞"
u = "⠥"
v = "⠧"
w = "⠺"
x = "⠭"
y = "⠽"
z = "⠵"

# 数字（数符のあと。1-9,0 = a-i,j）
[digits]
"1" = "⠁"
"2" = "⠃"
"3" = "⠉"
"4" = "⠙"
"5" = "⠑"
"6" = "⠋"
"7" = "⠛"
"8" = "⠓"
"9" = "⠊"
"0" = "⠚"

# 約物・記号（Rules of UEB 2024 §7 Punctuation / §3 General Symbols）
# 出典: https://iceb.org/wp-content/uploads/2025/10/Rules-of-Unified-English-Braille-2024.pdf
# 引用符は開き/閉じで形が違うので [quotes] に分ける（ここは1対1のもののみ）。
[punctuation]
# --- 基本約物 ---
"." = "⠲"
"," = "⠂"
";" = "⠆"
":" = "⠒"
"?" = "⠦"
"!" = "⠖"
"'" = "⠄"          # アポストロフィ（無方向の一重引用符）
"…" = "⠲⠲⠲"        # 省略記号（"..." は "." 3つで同じ列になる）
# --- ハイフン・ダッシュ・下線 ---
"-" = "⠤"          # ハイフン
"–" = "⠠⠤"         # ダッシュ（en dash）
"—" = "⠐⠠⠤"        # 長いダッシュ（em dash）
"_" = "⠨⠤"         # 下線（low line）
# --- 括弧 ---
"(" = "⠐⠣"
")" = "⠐⠜"
"[" = "⠨⠣"
"]" = "⠨⠜"
"{" = "⠸⠣"
"}" = "⠸⠜"
"<" = "⠈⠣"         # 山括弧／小なり（§3.17 と同セル）
">" = "⠈⠜"
# --- スラッシュ ---
"/" = "⠸⠌"         # solidus
"\\" = "⠸⠡"        # reverse solidus（backslash）
# --- 記号（§3）---
"@" = "⠈⠁"
"&" = "⠈⠯"
"*" = "⠐⠔"
"#" = "⠸⠹"
"•" = "⠸⠲"
"^" = "⠈⠢"
"~" = "⠈⠔"
"%" = "⠨⠴"
"°" = "⠘⠚"
"©" = "⠘⠉"
"®" = "⠘⠗"
"™" = "⠘⠞"
"§" = "⠘⠎"
"¶" = "⠘⠏"
# --- 通貨（§3.10）---
"$" = "⠈⠎"
"¢" = "⠈⠉"
"€" = "⠈⠑"
"£" = "⠈⠇"
"¥" = "⠈⠽"
# --- 演算・比較（§3.17）---
"+" = "⠐⠖"
"=" = "⠐⠶"
"×" = "⠐⠦"
"÷" = "⠐⠌"
"−" = "⠐⠤"        # 負号（U+2212。ASCII の "-" はハイフン）

# 引用符。開き/閉じは文脈で決める（直前が空白・行頭・開き括弧なら開き、でなければ閉じ）。
# 既定は1セルの非特定引用符 ⠦/⠴（§7.6 の用例が二重引用符にこれを使う）。
[quotes]
"\"" = { open = "⠦", close = "⠴" }
"“"  = { open = "⠦", close = "⠴" }
"”"  = { open = "⠦", close = "⠴" }
"‘"  = { open = "⠠⠦", close = "⠠⠴" }
"’"  = { open = "⠠⠦", close = "⠠⠴" }
