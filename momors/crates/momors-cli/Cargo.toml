[package]
name = "momors-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Japanese text to Braille converter"

[[bin]]
name = "momo"
path = "src/main.rs"

[[bin]]
name = "momo-compare-quant"
path = "src/bin/compare_quant.rs"

[[bin]]
name = "momo-inspect"
path = "src/bin/inspect.rs"

[features]
# BERT 読みモード（--bert）。ONNX Runtime に依存するので既定では入れない。
bert = ["dep:momors-bert"]

[dependencies]
momors-core.workspace = true
momors-braille.workspace = true
momors-bert = { workspace = true, optional = true }
clap.workspace = true
