[build]
target = "riscv32imafc-esp-espidf"
# 他クレートと同じ momors/target に出力する（このクレートは独自 [workspace] なので明示が必要）。
# 注意（Windows）: esp-idf-sys は出力ディレクトリのパスが 88 文字を超えるとビルドを拒否する。
# momo のリポジトリパスではこの target/ でも超過するため、Windows では WSL2 の
# ネイティブ Linux ファイルシステム上でビルドすること（`subst` や短縮パスは不可）。
target-dir = "../../target"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor --flash-size 16mb --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32p4"
ESP_IDF_VERSION = "v5.5.5"
# ESP-IDF と各種ツールを ~/.espressif に置く（workspace 配下だと Windows のパス長制限に当たりやすい）
ESP_IDF_TOOLS_INSTALL_DIR = "global"
# target ディレクトリがクレート外（momors/target）にあるため、embuild が
# プロジェクトルートを特定できるよう明示する（値はこの config.toml のあるディレクトリ）。
CARGO_WORKSPACE_DIR = { value = "", relative = true }
