[package]
name = "momors-mobile"
description = "Android / iOS (Kotlin / Swift) bindings for the momors Japanese Braille engine, generated with UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "momors_mobile"
# Android は cdylib（.so）、iOS は staticlib（XCFramework）、uniffi-bindgen のライブラリ読み取りに lib
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
momors-core.workspace = true
momors-braille.workspace = true
thiserror.workspace = true
uniffi = { version = "0.29", features = ["cli"] }
