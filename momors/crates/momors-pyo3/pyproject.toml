[project]
name = "momors-py"
version = "0.9.1"
description = "Python bindings for the MOMO Japanese text-to-Braille engine (Rust backend)"
authors = [{ name = "KIRIAKE Masanori", email = "seiken@rd01.net" }]
requires-python = ">=3.13"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "momors_py.momors_py"
python-source = "python"
features = ["pyo3/extension-module"]
include = ["python/momors_py/*.mbm"]
