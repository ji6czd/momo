baseURL = 'https://momo.seiken-lab.com'
locale = 'ja'
title = 'Japanese Braille Translation Library MOMO Project'
paginate = 5

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[minify]
disableXML = true
minifyOutput = true

[params]
description = 'Japanese Braille Translation Library MOMO Project'
author = 'Seiken Lab'
disableThemeToggle = false
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = false
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = false
tocopen = false

