weight = 2
[[menu.main]]
identifier = "cli"
name = "MOMO CLI"
url = "/cli/"
weight = 3
[[menu.main]]
identifier = "api"
name = "MOMO API"
url = "/api/"
weight = 4
[[menu.main]]
